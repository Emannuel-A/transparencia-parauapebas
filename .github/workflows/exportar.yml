name: Exportar dados (cifrados)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    env:
      PAINEL_CHAVE_DADOS: ${{ secrets.PAINEL_CHAVE_DADOS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
          key: dados-exp-${{ github.run_id }}
          restore-keys: dados-
      - run: python -m tools.exportar
      - uses: actions/upload-artifact@v4
        with:
          name: exportacao
          path: exportacao.bin
          retention-days: 1
